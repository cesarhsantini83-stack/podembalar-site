<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PodEmbalar — Links</title>
<meta name="description" content="Onde comprar potes e garrafas de vidro PodEmbalar: site oficial, Shopee, TikTok Shop, Mercado Livre e WhatsApp.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://use.typekit.net/yfh2jyt.css">
<style>
  :root{
    --cyan:#1CADE4;
    --navy:#1E2338;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"barlow", sans-serif;
    background:var(--navy);
    color:#fff;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  main{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  img.logo{
    height:44px;
    margin-bottom:20px;
  }
  .eyebrow{
    font-family:"loos-extrawide", sans-serif;
    font-weight:700;
    color:var(--cyan);
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:8px;
  }
  h1{
    font-family:"loos-extrawide", sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.3;
    margin-bottom:36px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#fff;
    color:var(--navy);
    text-decoration:none;
    font-family:"loos-extrawide", sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    padding:18px 20px;
    border-radius:10px;
    border:2px solid #fff;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .link-btn:hover, .link-btn:focus-visible{
    background:var(--navy);
    color:var(--cyan);
    border-color:var(--cyan);
  }
  .link-btn.whatsapp{
    background:var(--cyan);
    border-color:var(--cyan);
    color:var(--navy);
  }
  .link-btn.whatsapp:hover, .link-btn.whatsapp:focus-visible{
    background:var(--navy);
    color:var(--cyan);
  }
  footer{
    margin-top:40px;
    font-size:13px;
    opacity:.6;
  }
  footer a{color:var(--cyan);text-decoration:none;}
</style>
</head>
<body>

<main>
  <img class="logo" src="../assets/logo-negativo.png" alt="PodEmbalar">
  <div class="eyebrow">Potes e garrafas de vidro</div>
  <h1>Escolha onde quer comprar ou falar com a gente</h1>

  <div class="links">
    <a class="link-btn" href="https://www.podembalar.com.br" target="_blank" rel="noopener">Loja oficial — site</a>
    <a class="link-btn" href="https://shopee.com.br/podembalar" target="_blank" rel="noopener">Comprar no Shopee</a>
    <a class="link-btn" href="https://vt.tiktok.com/ZSbrTUad4/" target="_blank" rel="noopener">Comprar no TikTok Shop</a>
    <a class="link-btn" href="https://www.mercadolivre.com.br/pagina/podembal" target="_blank" rel="noopener">Comprar no Mercado Livre</a>
    <a class="link-btn whatsapp" href="https://api.whatsapp.com/send/?phone=551150436776&text=Ol%C3%A1+estou+entrando+em+contato+da+loja+virtual+PodEmbalar.&type=phone_number&app_absent=0" target="_blank" rel="noopener">Falar no WhatsApp</a>
  </div>

  <footer>PodEmbalar · <a href="https://www.podembalar.com.br">www.podembalar.com.br</a></footer>
</main>

</body>
</html>
